name: Steam bot

on:
  schedule:
    - cron: "*/5 * * * *"  # каждые 5 минут (минимум, который разрешает GitHub)
  workflow_dispatch:

concurrency:
  group: steam-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

      - name: Save history
        run: |
          if [ -n "$(git status --porcelain posted_games.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_games.json
            git commit -m "Update posted games"
            git pull --rebase
            git push
          fi
